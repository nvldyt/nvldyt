services:
  - type: web
    name: private-ephemeral-chat
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn secure_app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: ROOM_TTL_SECONDS
        value: 7200
      - key: IDLE_TTL_SECONDS
        value: 900
